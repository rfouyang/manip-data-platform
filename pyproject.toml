[project]
name = "manip-data-platform"
version = "0.1.0"
description = "Robot dataset conversion and visualization platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "h5py>=3.16.0",
    "jinja2>=3.1.6",
    "lerobot[dataset]==0.6.1",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.9.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
