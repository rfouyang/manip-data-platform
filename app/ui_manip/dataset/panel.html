<section data-panel="dataset" aria-labelledby="dataset-title">
  <header class="ui-page-head flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 id="dataset-title" class="ui-page-title">数据管理</h1>
      <p class="ui-page-desc">登记本地数据目录，查看字段、任务描述和数据质量。</p>
    </div>
    <button id="dataset-add" type="button" class="ui-btn ui-btn-primary">添加数据集</button>
  </header>

  <div class="space-y-5">
    <div id="dataset-message" class="empty:hidden" aria-live="polite"></div>

    <div class="ui-card p-0 md:p-0">
      <div class="overflow-x-auto">
        <table class="ui-table">
          <thead class="bg-gray-50 dark:bg-neutral-900">
            <tr>
              <th scope="col" class="ui-th">名称 / 目录</th>
              <th scope="col" class="ui-th">格式</th>
              <th scope="col" class="ui-th hidden sm:table-cell">规模</th>
              <th scope="col" class="ui-th hidden md:table-cell">登记时间</th>
              <th scope="col" class="ui-th text-end">操作</th>
            </tr>
          </thead>
          <tbody id="dataset-list" class="divide-y divide-gray-200 dark:divide-neutral-700"></tbody>
        </table>
      </div>
    </div>

    <div id="dataset-detail" class="space-y-5" hidden></div>
  </div>

  <dialog id="dataset-dialog" aria-labelledby="dataset-dialog-title"
    class="m-auto w-[min(32rem,calc(100%-2rem))] rounded-xl border border-gray-200 bg-white p-0 text-gray-800 shadow-xl backdrop:bg-gray-900/50 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-200">
    <form id="dataset-register-form" method="dialog" class="space-y-4 p-5">
      <h2 id="dataset-dialog-title" class="text-base font-semibold text-gray-800 dark:text-white">添加数据集</h2>
      <div>
        <label for="dataset-path" class="ui-label">数据目录</label>
        <input id="dataset-path" name="path" required class="ui-input" autocomplete="off" spellcheck="false" placeholder="目录名或绝对路径" aria-describedby="dataset-path-hint" />
        <p id="dataset-path-hint" class="ui-hint mt-1.5 break-all">相对路径以 {{ data_dir }} 为准。</p>
      </div>
      <div>
        <label for="dataset-name" class="ui-label">名称</label>
        <input id="dataset-name" name="name" class="ui-input" autocomplete="off" placeholder="默认使用目录名" />
      </div>
      <div id="dataset-dialog-message" class="empty:hidden" aria-live="polite"></div>
      <div class="flex justify-end gap-2">
        <button type="button" id="dataset-dialog-cancel" class="ui-btn">取消</button>
        <button type="submit" class="ui-btn ui-btn-primary">添加</button>
      </div>
    </form>
  </dialog>
</section>
