[project]
name = "lerobot-v21-check"
version = "0.1.0"
description = "Isolated env with the last LeRobot release for dataset format v2.1; only used to verify v2.1 output with official code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot==0.3.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
